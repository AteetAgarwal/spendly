{% extends "base.html" %}

{% block title %}Add Expense - Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}
<div class="add-expense-container">
    <div class="form-card">
        <div class="card-header">
            <h1 class="card-title">Add New Expense</h1>
            <p class="card-subtitle">Keep track of your spending by adding a new transaction.</p>
        </div>

        <form action="{{ url_for('add_expense') }}" method="POST" class="expense-form">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" step="0.01" name="amount" id="amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Health">Health</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" name="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea name="description" id="description" rows="3" placeholder="What was this for?"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="nav-cta">Save Expense</button>
                <a href="{{ url_for('profile') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
